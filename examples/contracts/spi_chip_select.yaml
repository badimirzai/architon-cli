contracts:
  - id: imu_spi
    scope:
      bus_type: spi
      bus_id: imu_spi
    require:
      connected:
        nets: [SPI_SCK, SPI_MOSI, SPI_MISO]
        chip_selects:
          - ref: U2
            net: IMU_CS
          - ref: U3
            net: MAG_CS
        participants:
          - { ref: U1, role: master }
          - { ref: U2, role: slave }
          - { ref: U3, role: slave }
    severity: error
